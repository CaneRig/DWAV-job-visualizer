# hh.ru Job Scraper Configuration
# ==================================

# Target number of cleaned job postings to collect
target_count: 5000

# Search queries: each defines a text search term and specialization filter
search_queries:
  - text: "Data Scientist"
    specialization: "1.221"
  - text: "Machine Learning"
    specialization: "1.221"
  - text: "Аналитик данных"
    specialization: "1.9"
  - text: "Data Engineer"
    specialization: "1.221"
  - text: "Программист"
    specialization: "1.173"
  - text: "Разработчик"
    specialization: "1.173"
  - text: "DevOps"
    specialization: "1.83"
  - text: "QA инженер"
    specialization: "1.25"
  - text: "Artificial Intelligence"
    specialization: "1.221"
  - text: "Deep Learning"
    specialization: "1.221"
  - text: "NLP"
    specialization: "1.221"
  - text: "Business Analyst"
    specialization: "1.9"
  - text: "System Administrator"
    specialization: "1.82"
  - text: "Product Manager"
    specialization: "1.89"
  - text: "Project Manager"
    specialization: "1.137"
  - text: "Python разработчик"
    specialization: "1.173"
  - text: "Frontend"
    specialization: "1.173"
  - text: "Backend"
    specialization: "1.173"
  - text: "Fullstack"
    specialization: "1.173"

# Area (city/region) IDs to search in
areas:
  - 1    # Moscow
  - 2    # St. Petersburg
  - 4    # Novosibirsk
  - 57   # Yekaterinburg
  - 60   # Kazan
  - 68   # Rostov-on-Don
  - 91   # Nizhny Novgorod

# How many days back to search for job postings
date_range_days: 30

# Delay between API requests in seconds (hh.ru limits: ~30 req/min)
request_delay_seconds: 2.1

# Maximum retries for failed requests
max_retries: 3

# Backoff factor for retries (delay = backoff_factor * 2^retry_number)
backoff_factor: 1

# Output directory for JSON files
output_dir: "output"

# State file for resume capability
state_file: "scraper_state.json"

# Logging
log_file: "scraper.log"
log_level: "INFO"

# Rate limiting
requests_per_minute: 28  # slightly under 30 to be safe

# Currency conversion rates to RUB (approximate)
currency_rates:
  RUR: 1.0
  RUB: 1.0
  USD: 92.0
  EUR: 100.0
  BYR: 0.029
  UAH: 2.5
  KZT: 0.2

